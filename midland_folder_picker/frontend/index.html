<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --background: #ffffff;
      --secondary: #f0f2f6;
      --text: #31333f;
      --primary: #ff4b4b;
      font-family: sans-serif;
      color: var(--text);
      background: var(--background);
      font-size: 14px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0 0 3px; }
    .label { margin-bottom: 7px; font-weight: 400; }
    .picker {
      padding: 14px;
      border-radius: 8px;
      background: var(--secondary);
    }
    .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    button {
      min-height: 38px;
      padding: 7px 13px;
      border: 1px solid color-mix(in srgb, var(--text) 24%, transparent);
      border-radius: 8px;
      color: var(--text);
      background: var(--background);
      font: inherit;
      cursor: pointer;
    }
    button:hover:enabled { border-color: var(--primary); color: var(--primary); }
    button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    button:disabled { cursor: default; opacity: 0.5; }
    #status { margin-top: 9px; line-height: 1.45; overflow-wrap: anywhere; }
    #status.error { color: var(--primary); }
    .hint { margin-top: 7px; line-height: 1.45; opacity: 0.75; font-size: 12px; }
  </style>
</head>
<body>
  <div class="label" id="label">Midland servicer folder</div>
  <div class="picker" aria-labelledby="label">
    <input id="folder" type="file" webkitdirectory directory multiple accept=".zip" hidden>
    <div class="actions">
      <button id="browse" type="button">Browse folders</button>
      <button id="clear" type="button" disabled>Clear</button>
    </div>
    <div id="status" role="status" aria-live="polite">Choose your Midland folder.</div>
    <div class="hint">Only the CAF bundles needed for the template quarters are uploaded.</div>
  </div>
  <script>
    (() => {
      "use strict";

      const input = document.getElementById("folder");
      const browse = document.getElementById("browse");
      const clear = document.getElementById("clear");
      const status = document.getElementById("status");
      const encoder = new TextEncoder();
      let files = new Map();
      let batchId = null;
      let folderName = "";
      let phase = "idle";
      let inFlight = null;
      let acknowledged = new Set();
      let started = new Set();
      let clearedValue = false;
      let handledError = null;
      let externallyDisabled = false;
      let remoteBatchId = null;

      function send(type, fields = {}, transfer = []) {
        window.parent.postMessage({ isStreamlitMessage: true, type, ...fields }, "*", transfer);
      }

      function setValue(value, dataType = "json", transfer = []) {
        send("streamlit:setComponentValue", { value, dataType }, transfer);
      }

      function id() {
        return typeof crypto.randomUUID === "function"
          ? crypto.randomUUID()
          : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function resize() {
        send("streamlit:setFrameHeight", { height: Math.ceil(document.body.getBoundingClientRect().height) + 2 });
      }

      function updateButtons() {
        const pending = phase === "manifest" || phase === "uploading";
        browse.disabled = externallyDisabled || pending;
        clear.disabled = externallyDisabled || pending || (!batchId && !remoteBatchId);
      }

      function show(message, error = false) {
        status.textContent = message;
        status.classList.toggle("error", error);
        updateButtons();
        resize();
      }

      function stopReader() {
        const previous = inFlight;
        inFlight = null;
        if (previous && previous.reader && previous.reader.readyState === FileReader.LOADING) {
          previous.reader.abort();
        }
      }

      function reset() {
        stopReader();
        files = new Map();
        batchId = null;
        folderName = "";
        phase = "idle";
        acknowledged = new Set();
        started = new Set();
        clearedValue = false;
        handledError = null;
        input.value = "";
      }

      function fail(message) {
        const failedBatch = batchId;
        stopReader();
        phase = "error";
        show(message, true);
        setValue({ kind: "error", batch_id: failedBatch, message });
      }

      function megabytes(size) {
        return (size / (1024 * 1024)).toFixed(1);
      }

      function startFile(request, item, position) {
        if (started.has(item.name)) return;
        const file = files.get(item.name);
        if (!file || file.size !== item.size) {
          fail("The selected folder changed. Please choose it again.");
          return;
        }
        const transfer = { batchId, name: item.name, reader: new FileReader() };
        inFlight = transfer;
        started.add(item.name);
        clearedValue = false;
        phase = "uploading";
        const prefix = `Bundle ${position + 1} of ${request.files.length}`;
        show(`Reading ${prefix.toLowerCase()} (0.0 / ${megabytes(file.size)} MB).`);

        function current() {
          return inFlight === transfer && batchId === transfer.batchId;
        }

        transfer.reader.onprogress = event => {
          if (current()) {
            show(`Reading ${prefix.toLowerCase()} (${megabytes(event.loaded)} / ${megabytes(file.size)} MB).`);
          }
        };
        transfer.reader.onerror = () => {
          if (current()) fail(`Could not read ${item.name}. Please choose the folder again.`);
        };
        transfer.reader.onabort = () => {
          if (current()) fail("The folder read was interrupted. Please choose it again.");
        };
        transfer.reader.onload = () => {
          if (!current()) return;
          try {
            const contents = new Uint8Array(transfer.reader.result);
            if (contents.byteLength !== file.size) throw new Error("Incomplete file read");
            const header = encoder.encode(JSON.stringify({ batch_id: batchId, name: item.name }));
            const packet = new Uint8Array(4 + header.byteLength + contents.byteLength);
            new DataView(packet.buffer).setUint32(0, header.byteLength, false);
            packet.set(header, 4);
            packet.set(contents, 4 + header.byteLength);
            show(`Uploading ${prefix.toLowerCase()} (${megabytes(file.size)} MB).`);
            setValue(packet, "bytes", [packet.buffer]);
          } catch (error) {
            fail(`Could not upload ${item.name}. Please choose the folder again.`);
          }
        };
        try {
          transfer.reader.readAsArrayBuffer(file);
        } catch (error) {
          fail(`Could not read ${item.name}. Please choose the folder again.`);
        }
      }

      function receiveRequest(request) {
        remoteBatchId = request && request.batch_id ? request.batch_id : null;
        if (!request) {
          updateButtons();
          return;
        }
        if (!batchId || request.batch_id !== batchId) {
          if (!batchId) show("Choose your Midland folder to select or change its bundles.");
          return;
        }
        if (request.error) {
          stopReader();
          phase = "error";
          show(String(request.error), true);
          const errorKey = `${batchId}:${request.error}`;
          if (handledError !== errorKey) {
            handledError = errorKey;
            setValue(null);
          }
          return;
        }
        if (phase === "error" || !Array.isArray(request.files)) return;
        if (request.ack && inFlight && request.ack === inFlight.name) {
          acknowledged.add(request.ack);
          inFlight = null;
        }
        if (inFlight) return;

        const position = request.files.findIndex(item => !acknowledged.has(item.name));
        if (position === -1) {
          phase = "loaded";
          const count = request.files.length;
          show(`Loaded ${count} ${count === 1 ? "bundle" : "bundles"} from ${request.folder_name || folderName || "the selected folder"}.`);
          if (!clearedValue) {
            clearedValue = true;
            setValue(null);
          }
          return;
        }
        startFile(request, request.files[position], position);
      }

      browse.addEventListener("click", () => {
        input.value = "";
        input.click();
      });

      input.addEventListener("change", () => {
        if (!input.files || input.files.length === 0) return;
        const selected = Array.from(input.files);
        reset();
        batchId = id();
        for (const file of selected) {
          if (/\.zip$/i.test(file.name)) files.set(file.webkitRelativePath || file.name, file);
        }
        const firstPath = selected[0].webkitRelativePath || "";
        folderName = firstPath.split("/")[0] || "the selected folder";
        phase = "manifest";
        show(`Checking ${files.size} ZIP ${files.size === 1 ? "file" : "files"} in ${folderName}.`);
        setValue({
          kind: "manifest",
          batch_id: batchId,
          files: Array.from(files, ([name, file]) => ({ name, size: file.size })),
        });
      });

      clear.addEventListener("click", () => {
        reset();
        remoteBatchId = null;
        show("Choose your Midland folder.");
        setValue({ kind: "clear", id: id() });
      });

      window.addEventListener("message", event => {
        if (event.source !== window.parent || !event.data || event.data.type !== "streamlit:render") return;
        const render = event.data;
        const theme = render.theme || {};
        const root = document.documentElement;
        for (const [name, value] of Object.entries({
          "--background": theme.backgroundColor,
          "--secondary": theme.secondaryBackgroundColor,
          "--text": theme.textColor,
          "--primary": theme.primaryColor,
        })) {
          if (value) root.style.setProperty(name, value);
        }
        if (theme.font) root.style.fontFamily = theme.font;
        externallyDisabled = Boolean(render.disabled);
        receiveRequest((render.args && render.args.request) || null);
        updateButtons();
        resize();
      });

      send("streamlit:componentReady", { apiVersion: 1 });
      resize();
      if (typeof ResizeObserver === "function") new ResizeObserver(resize).observe(document.body);
    })();
  </script>
</body>
</html>
